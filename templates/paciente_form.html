{% extends "base.html" %}
{% block titulo %}Novo paciente{% endblock %}
{% block conteudo %}
<header class="cabecalho">
  <h1>Novo paciente</h1>
  <p>CPF e telefone são guardados criptografados (LGPD).</p>
</header>

<section class="cartao">
  <form method="post" action="{{ url_for('novo_paciente') }}">
    <div class="grade-form">
      <div class="campo campo-largo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" value="{{ dados.nome or '' }}" required>
      </div>
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" value="{{ dados.cpf or '' }}" placeholder="000.000.000-00" required>
      </div>
      <div class="campo">
        <label for="data_nascimento">Data de nascimento</label>
        <input type="date" id="data_nascimento" name="data_nascimento" value="{{ dados.data_nascimento or '' }}" required>
      </div>
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" value="{{ dados.telefone or '' }}" placeholder="(11) 90000-0000" required>
      </div>
      <div class="campo">
        <label for="email">E-mail (opcional)</label>
        <input type="email" id="email" name="email" value="{{ dados.email or '' }}">
      </div>
      <label class="consentimento campo-largo">
        <input type="checkbox" name="consentimento" value="1" {{ 'checked' if dados.consentimento }}>
        O paciente autoriza o uso dos seus dados pessoais para o agendamento e o atendimento, conforme a LGPD.
      </label>
    </div>
    <div class="acoes-form">
      <button type="submit" class="botao">Salvar paciente</button>
      <a href="{{ url_for('pacientes') }}" class="botao botao-secundario">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
